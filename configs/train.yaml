model_name: "unsloth/llama-3-8b-Instruct-bnb-4bit" # Base model lượng tử hóa 4-bit
max_seq_length: 256  # Chiều dài chuỗi tối đa
load_in_4bit: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0
batch_size: 4  
gradient_accumulation_steps: 8 
learning_rate: 1e-4 
optimizer: "adamw_8bit" # Optimizer tiết kiệm bộ nhớ
num_train_epochs: 10 
output_dir: "outputs/banking-intent-model"
train_data_path: "sample_data/train.csv"
test_data_path: "sample_data/test.csv"